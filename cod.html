<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#f5f7fb">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>Bếp Nhà Duyên - Giá vốn</title>

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/cod.css">

</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <div class="brand-subtitle">
                QUẢN LÝ BÁN HÀNG
            </div>

            <h1>
                Bếp Nhà Duyên
            </h1>

        </div>


        <button
            type="button"
            class="header-theme-button"
            onclick="toggleDarkMode()"
            aria-label="Đổi giao diện">

            🌙

        </button>

    </header>



    <!-- COD -->

    <main id="codPage" class="page active-page">


        <!-- HERO -->

        <section class="cod-hero">

            <span>
                💰 QUẢN LÝ GIÁ VỐN
            </span>

            <h2>
                COD món ăn
            </h2>

            <p>
                Theo dõi chi phí từng thành phần
                của từng món.
            </p>

        </section>



        <!-- CATEGORY -->

        <section
            id="codCategoryView"
            class="card">

            <div class="section-heading">

                <div>

                    <h2>
                        📁 Danh mục món
                    </h2>

                    <small>
                        Chọn danh mục
                    </small>

                </div>

            </div>


            <div id="codCategoryList"></div>

        </section>



        <!-- DISH -->

        <section
            id="codDishView"
            class="card"
            style="display:none">


            <button
                type="button"
                class="back-button"
                onclick="showCODCategories()">

                ← Danh mục

            </button>


            <h2 id="codDishTitle">
                Danh sách món
            </h2>


            <div id="codDishList"></div>

        </section>



        <!-- DETAIL -->

        <section
            id="codDetailView"
            class="card"
            style="display:none">


            <button
                type="button"
                class="back-button"
                onclick="showCODDishes()">

                ← Danh sách món

            </button>



            <div class="cod-detail-header">

                <div>

                    <span class="cod-label">
                        MÓN ĐANG CHỌN
                    </span>

                    <h2 id="codDishName">
                        Món
                    </h2>

                    <small id="codDishCategory">
                        Danh mục
                    </small>

                </div>

            </div>



            <!-- GIÁ BÁN -->

            <label
                class="field-label"
                for="codSellingPrice">

                GIÁ BÁN

            </label>


            <input
                id="codSellingPrice"
                type="number"
                inputmode="decimal"
                min="0"
                placeholder="35000"
                oninput="calculateCOD()">



            <!-- SUMMARY -->

            <div class="cod-summary">


                <div class="cod-summary-box">

                    <span>
                        GIÁ VỐN
                    </span>

                    <strong
                        id="codTotalCost"
                        class="red-text">

                        0 ₫

                    </strong>

                </div>


                <div class="cod-summary-box">

                    <span>
                        LỢI NHUẬN
                    </span>

                    <strong
                        id="codDishProfit"
                        class="green-text">

                        0 ₫

                    </strong>

                </div>

            </div>



            <!-- PART HEADER -->

            <div class="cod-section-title">

                <strong>
                    📦 Thành phần
                </strong>

                <span id="codPartCount">
                    0 phần
                </span>

            </div>


            <div id="codPartList"></div>



            <!-- ADD PART -->

            <div class="cod-add-box">

                <h3>
                    ➕ Thêm thành phần
                </h3>


                <input
                    id="codPartName"
                    type="text"
                    autocomplete="off"
                    placeholder="Ví dụ: Thịt">


                <input
                    id="codPartAmount"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    placeholder="Giá tiền">


                <input
                    id="codPartNote"
                    type="text"
                    autocomplete="off"
                    placeholder="Ghi chú">


                <button
                    type="button"
                    class="cod-primary-button"
                    onclick="addCODPart()">

                    + Thêm thành phần

                </button>

            </div>



            <!-- SAVE -->

            <button
                type="button"
                class="cod-save-button"
                onclick="saveCODDish()">

                💾 Lưu giá vốn

            </button>

        </section>

    </main>



    <!-- NAV -->

    <nav class="bottom-nav">

        <button
            type="button"
            class="nav-button"
            onclick="navigateTo('home')">

            <span>🏠</span>
            <small>Trang chủ</small>

        </button>


        <button
            type="button"
            class="nav-button"
            onclick="navigateTo('statistics')">

            <span>📊</span>
            <small>Thống kê</small>

        </button>


        <button
            type="button"
            class="nav-button"
            onclick="navigateTo('history')">

            <span>📋</span>
            <small>Lịch sử</small>

        </button>


        <button
            type="button"
            class="nav-button"
            onclick="navigateTo('restaurant')">

            <span>🍜</span>
            <small>Quán</small>

        </button>


        <button
            type="button"
            class="nav-button active"
            onclick="navigateTo('cod')">

            <span>💰</span>
            <small>COD</small>

        </button>

    </nav>

</div>


<div id="toast" class="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./js/supabase.js"></script>
<script src="./js/app.js"></script>
<script src="./js/cod.js"></script>

</body>

</html>
