<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#f5f7fb">

    <title>Bếp Nhà Duyên - Thực đơn</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/restaurant.css">

</head>


<body>

<div class="app">

    <header class="header">

        <div class="header-left">

            <div class="brand-subtitle">
                QUẢN LÝ BÁN HÀNG
            </div>

            <h1 id="pageTitle">
                Thực đơn
            </h1>

        </div>


        <button
            type="button"
            class="header-theme-button"
            onclick="toggleDarkMode()"
            aria-label="Đổi giao diện">

            🌙

        </button>

    </header>


    <main
        id="restaurantPage"
        class="page active-page">


        <!-- HERO -->

        <section class="restaurant-hero">

            <span>
                🍜 BẾP NHÀ DUYÊN
            </span>

            <h2>
                Thực đơn
            </h2>

            <p>
                Quản lý danh mục và món ăn
            </p>

        </section>


        <!-- CATEGORY -->

        <section class="card">

            <div class="section-heading">

                <div>

                    <h2>
                        📁 Thêm danh mục
                    </h2>

                    <small>
                        Tạo nhóm món mới
                    </small>

                </div>

            </div>


            <div class="inline-form">

                <input
                    id="newCategoryName"
                    type="text"
                    autocomplete="off"
                    placeholder="Tên danh mục">


                <button
                    type="button"
                    class="primary-small-button"
                    onclick="addCategory()">

                    + Thêm

                </button>

            </div>

        </section>


        <!-- DISH -->

        <section class="card">

            <div class="section-heading">

                <div>

                    <h2>
                        🍜 Thêm món
                    </h2>

                    <small>
                        Thêm món vào thực đơn
                    </small>

                </div>

            </div>


            <select id="dishCategorySelect">

                <option value="">
                    Chọn danh mục
                </option>

            </select>


            <input
                id="newDishName"
                type="text"
                autocomplete="off"
                placeholder="Tên món">


            <button
                type="button"
                class="primary-button"
                onclick="addDish()">

                + Thêm món

            </button>

        </section>


        <!-- MENU -->

        <section class="card">

            <div class="section-heading">

                <div>

                    <h2>
                        Thực đơn của quán
                    </h2>

                    <small id="restaurantCount">
                        0 món
                    </small>

                </div>

            </div>


            <div id="restaurantMenuList"></div>

        </section>

    </main>


    <nav class="bottom-nav">

        <button
            type="button"
            id="navHome"
            class="nav-button"
            onclick="navigateTo('home')">

            <span>🏠</span>
            <small>Trang chủ</small>

        </button>


        <button
            type="button"
            id="navStatistics"
            class="nav-button"
            onclick="navigateTo('statistics')">

            <span>📊</span>
            <small>Thống kê</small>

        </button>


        <button
            type="button"
            id="navHistory"
            class="nav-button"
            onclick="navigateTo('history')">

            <span>📋</span>
            <small>Lịch sử</small>

        </button>


        <button
            type="button"
            id="navRestaurant"
            class="nav-button active"
            onclick="navigateTo('restaurant')">

            <span>🍜</span>
            <small>Quán</small>

        </button>


        <button
            type="button"
            id="navCOD"
            class="nav-button"
            onclick="navigateTo('cod')">

            <span>💰</span>
            <small>COD</small>

        </button>

    </nav>


    <div id="toast" class="toast"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="../js/restaurant.js"></script>

</body>

</html>
