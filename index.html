<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#f5f7fb">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <title>Bếp Nhà Duyên - Quản lý bán hàng</title>

    <link rel="stylesheet" href="./css/home.css">
    <link rel="stylesheet" href="./css/statistics.css">
    <link rel="stylesheet" href="./css/history.css">
    <link rel="stylesheet" href="./css/restaurant.css">
    <link rel="stylesheet" href="./css/cod.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/home.css">

</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <div class="brand-subtitle">
                QUẢN LÝ BÁN HÀNG
            </div>

            <h1 id="pageTitle">
                Bếp Nhà Duyên
            </h1>

        </div>


        <button
            type="button"
            class="header-theme-button"
            onclick="toggleDarkMode()"
            aria-label="Đổi giao diện">

            🌙

        </button>

    </header>



    <!-- HOME -->

    <main id="homePage" class="page active-page">


        <!-- LỢI NHUẬN -->

        <section class="balance-card">

            <div class="balance-label">
                LỢI NHUẬN THỰC
            </div>

            <div id="homeProfit" class="balance-number">
                0 ₫
            </div>


            <div class="balance-grid">

                <div class="balance-item">

                    <span>
                        Doanh thu
                    </span>

                    <strong id="homeRevenue">
                        0 ₫
                    </strong>

                </div>


                <div class="balance-item">

                    <span>
                        Chi phí
                    </span>

                    <strong id="homeExpense">
                        0 ₫
                    </strong>

                </div>


                <div class="balance-item">

                    <span>
                        Đơn hàng
                    </span>

                    <strong id="homeOrders">
                        0
                    </strong>

                </div>

            </div>

        </section>



        <!-- THÊM GIAO DỊCH -->

        <section class="card transaction-card">

            <div class="section-heading">

                <div>

                    <h2>
                        Thêm giao dịch
                    </h2>

                    <small>
                        Ghi nhận thu / chi
                    </small>

                </div>

            </div>



            <!-- THU / CHI -->

            <div class="transaction-type">

                <button
                    type="button"
                    id="incomeTypeButton"
                    class="type-button active"
                    onclick="setTransactionType('thu')">

                    <span>💚</span>
                    Thu

                </button>


                <button
                    type="button"
                    id="expenseTypeButton"
                    class="type-button"
                    onclick="setTransactionType('chi')">

                    <span>❤️</span>
                    Chi

                </button>

            </div>



            <!-- DANH MỤC -->

            <label
                class="field-label"
                for="transactionCategory">

                DANH MỤC

            </label>


            <select id="transactionCategory">

                <option value="">
                    Chọn danh mục
                </option>

            </select>



            <!-- MÓN -->

            <label
                class="field-label"
                for="transactionDish">

                MÓN / KHOẢN

            </label>


            <select id="transactionDish">

                <option value="">
                    Chọn món
                </option>

            </select>



            <!-- TÊN KHÁC -->

            <label
                class="field-label"
                for="transactionName">

                TÊN KHÁC

            </label>


            <input
                id="transactionName"
                type="text"
                autocomplete="off"
                placeholder="Tên món / khoản chi">



            <!-- NGUỒN ĐƠN -->

            <div id="orderSourceBox">

                <label class="field-label">
                    NGUỒN ĐƠN
                </label>


                <div class="source-grid">

                    <button
                        type="button"
                        id="sourceShopee"
                        class="source-button active"
                        onclick="setOrderSource('ShopeeFood')">

                        🟠 ShopeeFood

                    </button>


                    <button
                        type="button"
                        id="sourceGrab"
                        class="source-button"
                        onclick="setOrderSource('GrabFood')">

                        🟢 GrabFood

                    </button>


                    <button
                        type="button"
                        id="sourceOutside"
                        class="source-button"
                        onclick="setOrderSource('Ngoài sàn')">

                        🔵 Ngoài sàn

                    </button>

                </div>

            </div>



            <!-- PHÍ APP -->

            <div id="appFeeBox">

                <label
                    class="field-label"
                    for="appFee">

                    KHẤU TRỪ APP

                </label>


                <input
                    id="appFee"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    placeholder="Tiền app khấu trừ">


                <small class="field-help">

                    Nhập số tiền thực tế bị app khấu trừ.

                </small>

            </div>



            <!-- SỐ TIỀN -->

            <label
                class="field-label"
                for="transactionAmount">

                SỐ TIỀN

            </label>


            <input
                id="transactionAmount"
                class="amount-input"
                type="number"
                inputmode="decimal"
                min="0"
                placeholder="0">



            <!-- NGÀY -->

            <label
                class="field-label"
                for="transactionDate">

                NGÀY

            </label>


            <input
                id="transactionDate"
                type="date">



            <!-- GHI CHÚ -->

            <label
                class="field-label"
                for="transactionNote">

                GHI CHÚ

            </label>


            <input
                id="transactionNote"
                type="text"
                autocomplete="off"
                placeholder="Không bắt buộc">



            <!-- LƯU -->

            <button
                type="button"
                class="primary-button"
                onclick="saveTransaction()">

                💾 Lưu giao dịch

            </button>


            <!-- HỦY SỬA -->

            <button
                type="button"
                id="cancelEditButton"
                class="secondary-button"
                onclick="cancelEdit()"
                style="display:none">

                Hủy sửa

            </button>

        </section>



        <!-- HÔM NAY -->

        <section class="card">

            <div class="section-heading">

                <div>

                    <h2>
                        Hôm nay
                    </h2>

                    <small id="todayLabel"></small>

                </div>

            </div>


            <div class="quick-grid">


                <div class="quick-card green-card">

                    <span>
                        DOANH THU
                    </span>

                    <strong
                        id="todayRevenue"
                        class="green-text">

                        0 ₫

                    </strong>

                </div>


                <div class="quick-card red-card">

                    <span>
                        CHI PHÍ
                    </span>

                    <strong
                        id="todayExpense"
                        class="red-text">

                        0 ₫

                    </strong>

                </div>


                <div class="quick-card orange-card">

                    <span>
                        PHÍ APP
                    </span>

                    <strong
                        id="todayAppFee"
                        class="orange-text">

                        0 ₫

                    </strong>

                </div>


                <div class="quick-card blue-card">

                    <span>
                        GIÁ VỐN
                    </span>

                    <strong
                        id="todayCost"
                        class="blue-text">

                        0 ₫

                    </strong>

                </div>

            </div>

        </section>

    </main>



    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button
            type="button"
            id="navHome"
            class="nav-button active"
            onclick="navigateTo('home')">

            <span>🏠</span>
            <small>Trang chủ</small>

        </button>


        <button
            type="button"
            id="navStatistics"
            class="nav-button"
            onclick="navigateTo('statistics')">

            <span>📊</span>
            <small>Thống kê</small>

        </button>


        <button
            type="button"
            id="navHistory"
            class="nav-button"
            onclick="navigateTo('history')">

            <span>📋</span>
            <small>Lịch sử</small>

        </button>


        <button
            type="button"
            id="navRestaurant"
            class="nav-button"
            onclick="navigateTo('restaurant')">

            <span>🍜</span>
            <small>Quán</small>

        </button>


        <button
            type="button"
            id="navCOD"
            class="nav-button"
            onclick="navigateTo('cod')">

            <span>💰</span>
            <small>COD</small>

        </button>

    </nav>

</div>



<!-- TOAST -->

<div id="toast" class="toast"></div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./js/supabase.js"></script>
<script src="./js/app.js"></script>
<script src="./js/home.js"></script>

</body>

</html>
